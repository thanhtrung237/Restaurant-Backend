name: restaurant-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER to a regular application user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql_data:/var/lib/mysql
    # No published database port. Import/administer over SSH + docker compose exec.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 20
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the published GHCR image}
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      API_PREFIX: /api/v1
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      # First import the schema/data. Do not create/drop schema on each deployment.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DOCKER_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "false"
      SPRING_SQL_INIT_MODE: never
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      CLOUDINARY_URL: ${CLOUDINARY_URL:?Set CLOUDINARY_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-}
      SEPAY_BANK: ${SEPAY_BANK:-STB}
      DISCORD_TRANSACTION_WEBHOOK_URL: ${DISCORD_TRANSACTION_WEBHOOK_URL:-}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_PUBLIC_ORIGIN:?Set APP_PUBLIC_ORIGIN}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
      TZ: Asia/Ho_Chi_Minh
    # Debug/admin only, reachable over an SSH tunnel, not the public interface.
    ports:
      - "127.0.0.1:${BACKEND_ADMIN_PORT:-8081}:8080"
    stop_grace_period: 30s
    logging: *logging

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-restaurant-production_mysql_data}
