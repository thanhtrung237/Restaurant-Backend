spring.application.name=Restaurant-Backend

api.prefix=${API_PREFIX}

server.port=${SERVER_PORT}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# UTF-8 encoding for MySQL connection
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
spring.jpa.properties.hibernate.jdbc.charset=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.defer-datasource-initialization=${SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION}

# spring.sql.init.mode=${SPRING_SQL_INIT_MODE}

cloudinary.url=${CLOUDINARY_URL}

spring.app.jwtAccessSecret=${JWT_ACCESS_SECRET}
spring.app.jwtRefreshSecret=${JWT_REFRESH_SECRET}
spring.app.jwtAccessExpirationMs=${JWT_ACCESS_EXPIRATION_MS}
spring.app.jwtRefreshExpirationDays=${JWT_REFRESH_EXPIRATION_DAYS}


# Debug logging
logging.level.com.group.restaurant=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG




# Comma-separated frontend origins for REST and WebSocket (include HTTPS demo/production origin).
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://192.168.1.*:*,http://127.0.0.1:*}
