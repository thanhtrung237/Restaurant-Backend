name: Backend CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto-format Java on branch
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.format.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Format and push branch changes
        id: format
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sed -i 's/\r$//' gradlew
          base=$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH" || true)
          bash ./gradlew --no-daemon --console=plain spotlessApply "-PformatBase=$base"

          if ! git diff --quiet -- src/main/java src/test/java; then
            git add -u -- src/main/java src/test/java
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style: apply Spotless formatting'
            git push --force-with-lease="$GITHUB_REF:$GITHUB_SHA" origin "HEAD:$GITHUB_REF"
          fi

          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    name: Format, test and build
    needs: format
    if: ${{ !cancelled() && !github.event.deleted && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.format.outputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - run: sed -i 's/\r$//' gradlew

      - name: Check Java formatting
        if: needs.format.result == 'skipped'
        shell: bash
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          base=$(git rev-parse --verify "${FORMAT_BASE}^{commit}" 2>/dev/null || true)
          bash ./gradlew --no-daemon --console=plain spotlessCheck "-PformatBase=$base"

      - name: Run tests and build Boot JAR
        run: bash ./gradlew --no-daemon --console=plain test bootJar

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore

  publish:
    name: Publish backend image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: restaurant-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Docker image
        run: |
          docker build --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: Smoke test backend with MySQL
        run: bash .github/scripts/smoke-backend.sh "$IMAGE"

      - name: Push image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE" "$registry_image:sha-$GITHUB_SHA"
          docker tag "$IMAGE" "$registry_image:latest"
          docker push "$registry_image:sha-$GITHUB_SHA"
          docker push "$registry_image:latest"

  deploy:
    name: Deploy backend to Docker Compose
    needs: publish
    if: github.event.repository.private && vars.RESTAURANT_BACKEND_DIR != ''
    runs-on: [self-hosted, Windows, restaurant-backend-deploy]
    timeout-minutes: 10
    env:
      RESTAURANT_BACKEND_DIR: ${{ vars.RESTAURANT_BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Pull and start backend
        shell: powershell
        run: |
          $image = 'ghcr.io/{0}:sha-{1}' -f $env:GITHUB_REPOSITORY.ToLowerInvariant(), $env:GITHUB_SHA
          & .\deploy\deploy-backend.ps1 -BackendDirectory $env:RESTAURANT_BACKEND_DIR -Image $image
