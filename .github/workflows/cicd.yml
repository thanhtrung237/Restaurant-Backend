name: CI/CD - Spring Boot (Gradle)

on:
  push:
    branches:
      - main
      - deploy
      - dev
      - develop
      - tai-dev
      - trung-dev
  pull_request:
    branches:
      - main
      - deploy
      - dev
      - develop
      - tai-dev
      - trung-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/deploy' }}

jobs:
  check:
    name: Build & Test Spring Boot
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Gradle Wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew --no-daemon --console=plain clean build

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore

  publish:
    name: Publish backend image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: restaurant-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Docker image
        run: |
          docker build --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: Smoke test backend with MySQL
        run: bash .github/scripts/smoke-backend.sh "$IMAGE"

      - name: Push image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE" "$registry_image:sha-$GITHUB_SHA"
          docker tag "$IMAGE" "$registry_image:latest"
          docker push "$registry_image:sha-$GITHUB_SHA"
          docker push "$registry_image:latest"

  publish-docker-hub:
    name: Build and push to Docker Hub
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_image: ${{ steps.push_image.outputs.release_image }}
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and smoke test
        run: |
          docker build --platform linux/amd64 --tag "restaurant-backend:$GITHUB_SHA" .
          bash .github/scripts/smoke-backend.sh "restaurant-backend:$GITHUB_SHA"

      - name: Push Docker image
        id: push_image
        run: |
          set -euo pipefail
          [[ "$DOCKER_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ && -n "$DOCKER_PASSWORD" ]]
          image="docker.io/$DOCKER_USERNAME/restaurant-backend"
          printf '%s' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
          docker tag "restaurant-backend:$GITHUB_SHA" "$image:sha-$GITHUB_SHA"
          docker tag "restaurant-backend:$GITHUB_SHA" "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          digest=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'release_image=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy backend to EC2 via SSH
    needs: publish-docker-hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    runs-on: ${{ vars.EC2_SSH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Update backend on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          RELEASE_IMAGE: ${{ needs.publish-docker-hub.outputs.release_image }}
        run: bash .github/scripts/deploy-ec2.sh
