name: CI/CD - Spring Boot (Gradle)

on:
  push:
    branches:
      - main
      - deploy
      - dev
      - develop
      - tai-dev
      - trung-dev
  pull_request:
    branches:
      - main
      - deploy
      - dev
      - develop
      - tai-dev
      - trung-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/deploy' }}

jobs:
  check:
    name: Build & Test Spring Boot
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Gradle Wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew --no-daemon --console=plain clean build

      - name: Prepare backend JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one runnable JAR in build/libs, found ${#jars[@]}." >&2
            exit 1
          fi
          install -D -- "${jars[0]}" build/ci-artifact/app.jar

      - name: Upload backend JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
        uses: actions/upload-artifact@v6
        with:
          name: backend-boot-jar
          path: build/ci-artifact/app.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore

  publish-docker-hub:
    name: Build and push to Docker Hub
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_digest: ${{ steps.push_image.outputs.release_digest }}
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download backend JAR from CI
        uses: actions/download-artifact@v7
        with:
          name: backend-boot-jar
          path: build/ci-artifact

      - name: Package Docker image
        run: |
          docker build --platform linux/amd64 --target runtime-ci \
            --build-context ci_jar=build/ci-artifact \
            --tag "restaurant-backend:$GITHUB_SHA" .

      - name: Smoke test backend with MySQL
        run: bash .github/scripts/smoke-backend.sh "restaurant-backend:$GITHUB_SHA"

      - name: Push Docker image
        id: push_image
        run: |
          set -euo pipefail
          [[ "$DOCKER_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ && -n "$DOCKER_PASSWORD" ]]
          image="docker.io/$DOCKER_USERNAME/restaurant-backend"
          printf '%s' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
          docker tag "restaurant-backend:$GITHUB_SHA" "$image:sha-$GITHUB_SHA"
          docker tag "restaurant-backend:$GITHUB_SHA" "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          digest=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'release_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy backend to EC2 via SSH
    needs: publish-docker-hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    runs-on: ${{ vars.EC2_SSH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show runner public IP
        run: curl -4fsS https://checkip.amazonaws.com

      - name: Update backend on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          RELEASE_DIGEST: ${{ needs.publish-docker-hub.outputs.release_digest }}
        run: bash .github/scripts/deploy-ec2.sh
